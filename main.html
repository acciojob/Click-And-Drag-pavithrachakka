<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Click and Drag</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="items">
    <div class="item item1">01</div>
    <div class="item item2">02</div>
    <div class="item item3">03</div>
    <div class="item item4">04</div>
    <div class="item item5">05</div>
    <div class="item item6">06</div>
    <div class="item item7">07</div>
    <div class="item item8">08</div>
    <div class="item item9">09</div>
    <div class="item item10">10</div>
    <div class="item item11">11</div>
    <div class="item item12">12</div>
    <div class="item item13">13</div>
    <div class="item item14">14</div>
    <div class="item item15">15</div>
    <div class="item item16">16</div>
    <div class="item item17">17</div>
    <div class="item item18">18</div>
    <div class="item item19">19</div>
    <div class="item item20">20</div>
    <div class="item item21">21</div>
    <div class="item item22">22</div>
    <div class="item item23">23</div>
    <div class="item item24">24</div>
    <div class="item item25">25</div>
  </div>

<script>
//Your code goes here 
	// Get container and cubes - works for both naming
const container = document.querySelector('.items') || document.querySelector('.container');
const cubes = document.querySelectorAll('.item') || document.querySelectorAll('.cube');

let selectedCube = null;
let offsetX = 0;
let offsetY = 0;
let isDragging = false;

function initPosition() {
  const gap = 20;
  const size = 100;
  const cols = 4; // 12 items = 4x3 grid looks good

  cubes.forEach((cube, index) => {
    const row = Math.floor(index / cols);
    const col = index % cols;
    const left = 20 + col * (size + gap);
    const top = 20 + row * (size + gap);
    cube.style.left = left + 'px';
    cube.style.top = top + 'px';
    cube.style.position = 'absolute';
  });
}

initPosition();

cubes.forEach(cube => {
  cube.addEventListener('mousedown', (e) => {
    selectedCube = cube;
    isDragging = true;
    const rect = cube.getBoundingClientRect();
    offsetX = e.clientX - rect.left;
    offsetY = e.clientY - rect.top;
    cube.style.zIndex = 1000;
    e.preventDefault();
  });
});

document.addEventListener('mousemove', (e) => {
  if (!isDragging || !selectedCube) return;
  
  const containerRect = container.getBoundingClientRect();
  let newLeft = e.clientX - containerRect.left - offsetX;
  let newTop = e.clientY - containerRect.top - offsetY;

  const maxLeft = container.clientWidth - selectedCube.offsetWidth;
  const maxTop = container.clientHeight - selectedCube.offsetHeight;

  // Boundary - snap back inside
  newLeft = Math.max(0, Math.min(newLeft, maxLeft));
  newTop = Math.max(0, Math.min(newTop, maxTop));

  selectedCube.style.left = newLeft + 'px';
  selectedCube.style.top = newTop + 'px';
});

document.addEventListener('mouseup', () => {
  if (selectedCube) selectedCube.style.zIndex = 1;
  isDragging = false;
  selectedCube = null;
});
</script>

  </body>
</html>
